name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/server/config.ini

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /app/client
    env_file:
      - ./client/envs/client1.env
    networks:
      - testing_net
    volumes:
      - ./client/config.yaml:/app/config.yaml:ro
      - .data/agency-1.csv:/app/agency.csv:ro
    depends_on:
      - server


networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
