name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
      - LOGGING_LEVEL=INFO
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/server/config.ini

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /app/client
    environment:
      - CLI_ID=1
      - CLI_LOG_LEVEL=INFO
    networks:
      - testing_net
    volumes:
      - ./client/config.yaml:/app/config.yaml:ro
    depends_on:
      - server

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
